# Netlify serves the React frontend. API calls stay same-origin (/api/...) and are
# proxied to the FastAPI backend on Railway, so no CORS setup is needed.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Backend on Railway (Singapore). Change this if the Railway domain changes.
[[redirects]]
  from = "/api/*"
  to = "https://api-production-7190a400.up.railway.app/api/:splat"
  status = 200
  force = true

# The app routes with #hashes, but send any deep link to the app too.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Always revalidate the HTML so a new deploy shows up immediately; hashed assets cache forever.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
